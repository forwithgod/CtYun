name: Build and Release

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            archive: zip
          - rid: linux-x64
            archive: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Read project version
        id: version
        shell: bash
        run: |
          version=$(grep -oP '(?<=<FileVersion>).*?(?=</FileVersion>)' CtYun/CtYun.csproj)
          if [ -z "$version" ]; then
            echo "无法从 CtYun.csproj 读取 FileVersion"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "版本号：$version"

      - name: Restore
        run: dotnet restore CtYun/CtYun.csproj -r ${{ matrix.rid }}

      - name: Publish
        run: >
          dotnet publish CtYun/CtYun.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          --no-restore
          -p:PublishAot=false
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o publish/${{ matrix.rid }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          name="CtYun-${{ matrix.rid }}-v${version}"
          cd publish
          if [ "${{ matrix.archive }}" = "zip" ]; then
            zip -r "../${name}.zip" "${{ matrix.rid }}"
            ls -lh "../${name}.zip"
          else
            tar -czf "../${name}.tar.gz" "${{ matrix.rid }}"
            ls -lh "../${name}.tar.gz"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CtYun-${{ matrix.rid }}-v${{ steps.version.outputs.version }}
          path: CtYun-${{ matrix.rid }}-v${{ steps.version.outputs.version }}.*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read project version
        id: version
        shell: bash
        run: |
          version=$(grep -oP '(?<=<FileVersion>).*?(?=</FileVersion>)' CtYun/CtYun.csproj)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body: |
            由 GitHub Actions 自动构建，版本 v${{ steps.version.outputs.version }}。

            - Windows：下载 `CtYun-win-x64-*.zip`，解压后运行 `CtYun.exe`
            - Linux：下载 `CtYun-linux-x64-*.tar.gz`，解压后运行 `./CtYun`
          files: dist/*
          draft: false
          prerelease: false
          generate_release_notes: false

  docker:
    name: Docker image
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    steps:
      - name: Checkout
        if: env.DOCKER_USERNAME != ''
        uses: actions/checkout@v4

      - name: Read project version
        if: env.DOCKER_USERNAME != ''
        id: version
        shell: bash
        run: |
          version=$(grep -oP '(?<=<FileVersion>).*?(?=</FileVersion>)' CtYun/CtYun.csproj)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: env.DOCKER_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        if: env.DOCKER_USERNAME != ''
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Build and push multi-arch image
        if: env.DOCKER_USERNAME != ''
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t "${DOCKER_USERNAME}/ctyun:${{ steps.version.outputs.version }}" \
            -t "${DOCKER_USERNAME}/ctyun:latest" \
            -f ./CtYun/Dockerfile \
            --push .
